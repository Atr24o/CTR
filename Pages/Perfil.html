    <!DOCTYPE html>
    <html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>CTR - Perfil</title>
    </head>
    <body>

        <header>
            <h1>CTR</h1>
            <button id="user">
                <img src="css/images/User.png" alt="Icon-user" width="40">
            </button>
        </header>

        <div id="perfil">
            <h2>Meu Perfil</h2>
            
            <div>
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" disabled>
            </div>
            
            <div>
                <label for="email">Email:</label>
                <input type="email" id="email" disabled>
            </div>
            
            <div>
                <label for="profissao">Profissão:</label>
                <input type="text" id="profissao" disabled>
            </div>
            
            <div id="mensagem"></div>
            
            <button id="btnEditar">✏️ Editar Perfil</button>
            <button id="btnSalvar" style="display:none">💾 Salvar Alterações</button>
            <button id="btnLogout">🚪 Sair da Conta</button>
            <button id="btnVoltar">⬅️ Voltar</button>
        </div>

        <script href="Js/main.js"></script>

    </body>
    </html>
