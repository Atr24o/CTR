<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTR - Meu Perfil</title>
    <link rel="stylesheet" href="css/BaseKit.css">
    <link rel="stylesheet" href="css/Perfil.css">
</head>
<body id="PgPerfil">
    <header>
        <h1><a href="Main_page.html">CTR</a></h1>
    </header>

    <main id="perfil">
        <a class="perfil-voltar" href="Main_page.html">← Voltar ao início</a>

        <section id="perfil-cabecalho" aria-labelledby="perfil-titulo">
            <div class="avatar-uploader">
                <img id="avatar-preview" src="css/images/User.png" alt="Prévia da foto de perfil">
                <input class="avatar-input" type="file" id="foto-perfil" accept="image/png,image/jpeg,image/webp,image/gif">
                <label class="avatar-plus" for="foto-perfil" aria-label="Trocar foto de perfil" title="Trocar foto de perfil">+</label>
            </div>
            <div class="perfil-identificacao">
                <p class="perfil-etiqueta">MINHA CONTA</p>
                <h2 id="perfil-titulo">Meu perfil</h2>
                <p>Consulte e atualize seus dados pessoais.</p>
            </div>
        </section>

        <form id="form-perfil">
            <div class="perfil-campos">
                <div class="campo-perfil">
                    <label for="nome-perfil">Nome completo</label>
                    <input type="text" id="nome-perfil" autocomplete="name" required>
                </div>

                <div class="campo-perfil">
                    <label for="email-perfil">Email</label>
                    <input type="email" id="email-perfil" autocomplete="email" required>
                </div>

                <div class="campo-perfil campo-largo">
                    <label for="profissao-perfil">Profissão</label>
                    <input type="text" id="profissao-perfil" autocomplete="organization-title">
                </div>
            </div>

            <section class="secao-senha" aria-labelledby="senha-titulo">
                <h3 id="senha-titulo">Alterar senha</h3>
                <p>Deixe os campos em branco para manter sua senha atual.</p>

                <div class="perfil-campos">
                    <div class="campo-perfil">
                        <label for="nova-senha">Nova senha</label>
                        <input type="password" id="nova-senha" autocomplete="new-password" minlength="8">
                    </div>

                    <div class="campo-perfil">
                        <label for="confirmar-senha">Confirmar nova senha</label>
                        <input type="password" id="confirmar-senha" autocomplete="new-password">
                    </div>
                </div>
            </section>

            <p id="perfil-mensagem" class="perfil-mensagem" aria-live="polite"></p>

            <div class="perfil-acoes">
                <button type="submit" id="salvar-perfil">Salvar alterações</button>
                <button type="button" id="sair-perfil">Sair da conta</button>
            </div>
        </form>
    </main>

    <script src="Js/storage.js"></script>
    <script src="Js/perfil.js"></script>
</body>
</html>
