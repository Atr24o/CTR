<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTR - Login</title>
    <link rel="stylesheet" href="css/CadLog.css">
    <link rel="stylesheet" href="css/BaseKit.css">
</head>
<body>
    <header>
        <h1>CTR</h1>
    </header>
    <div id="CadLog">
        <h2 id="Log">Login</h2>
        <div class="grupo-input">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Digite seu email aqui" />
            
            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="Mínimo 8 caracteres" />
            
            <button onclick="login()">
                Entrar
            </button>
            
            <p>sem uma conta?<br><a href="Cadastro.html">Cadastre sua conta aqui</a></p>
        </div>
    </div>
    
    <!-- ⬇️ ARQUIVO JS SEPARADO ⬇️ -->
    <script src="js/login.js"></script>
</body>
</html>
