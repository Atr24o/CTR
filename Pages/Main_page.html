<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTR</title>

    <!-- ⬇️ CSS AQUI ⬇️ -->
    <link rel="stylesheet" href="css/Main_Page.css">
    <link rel="stylesheet" href="css/BaseKit.css">
</head>
<body>

    <header>
        <h1>CTR</h1>
        <a href="Cadastro.html">
            <button id="user" data-text="Visitante" onclick="redirecionarUsuario()">
                <img src="css/images/User.png" alt="Icon-user" class="logo-do-botao">
            </button>
        </a>
    </header>

    <div id="intro">
        <p id="slogan">Trabalhe junto,<br> de qualquer lugar</p>
        <div>
            <img src="css/images/3-maneiras-de-tornar-o-home-office-ou-estudo-em-casa-mais-agradável-2.jpg" alt="homem trabalhando homeoffice" id="esq">
            <img src="css/images/images.jpg" alt="mulher trabalhando em homeoffice com seu cachorro" id="dir">
        </div>
        <img src="css/images/carta.png" alt="mensagem sendo enviada" id="carta">
    </div>

    <div id="grid">
        <a href="Entrar_Equipes.html" id="linkEntrar">
            <button id="Entrar">
                Entrar em uma equipe
            </button>
        </a>
        
        <a href="Criar_Equipe.html" id="linkCriar">
            <button id="Criar">
                Criar uma equipe
            </button>
        </a>
    </div>

    <!-- Modal de aviso -->
    <div id="modalAviso" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center;">
        <div style="background: white; padding: 30px; border-radius: 10px; max-width: 400px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
            <h3 style="color: #333; margin-bottom: 15px;">⚠️ Acesso Restrito</h3>
            <p style="color: #666; margin-bottom: 20px;">Você precisa estar logado para criar ou entrar em uma equipe.</p>
            <button onclick="fecharModal()" style="background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px;">
                OK, entendi
            </button>
        </div>
    </div>



    <!-- ⬇️ JAVA SCRIPT AQUI ⬇️ -->
    <script src="Js/storage.js"></script>
    <script src="Js/main.js"></script>
</body>
</html>
