<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTR</title>
    <link rel="stylesheet" href="css/CadLog.css">
    <link rel="stylesheet" href="css/BaseKit.css">
</head>
<body>
    <header>
        <h1>CTR</h1>
    </header>
    <div id="CadLog">
        <h2 id="Cad">CADASTRO</h2>
        <div class="grupo-input">
            <label for="nome">Nome Completo</label>
            <input type="text" id="nome" placeholder="Digite seu nome aqui" />
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Digite seu email aqui" />
            <label for="senha">senha</label>
            <input type="password" id="senha" placeholder="Minimo 6 caracteres" />
            <label for="senha">confirmar senha</label>
            <input type="password" id="senha_confirmação" placeholder="Minimo 6 caracteres" />
            <label for="profissao">profissão</label>
            <input type="text" id="profissão" placeholder="Digite seu cargo aqui" />
            <label for="fotoPerfil">Foto de Perfil</label>
            <input type="file" id="fotoPerfil" accept="image/*" />
            <small>Selecione uma imagem para seu perfil</small>
            <a href="Login.html">
                <button>
                    Criar conta
                </button>
            </a>
            <p>já tem uma conta?<br><a href="Login.html" id="troca">entre na sua conta aqui</a></p>
        </div>
    </div>
    <footer>
        
    </footer>

</html>
